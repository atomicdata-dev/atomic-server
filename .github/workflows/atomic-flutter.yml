name: Atomic Flutter package
on:
  pull_request:
    paths: ['packages/atomic_flutter/**', 'flutter/**', 'browser/**', '.github/workflows/atomic-flutter.yml']
  push:
    paths: ['packages/atomic_flutter/**', 'flutter/**', 'browser/**', '.github/workflows/atomic-flutter.yml']
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: packages/atomic_flutter
      - run: flutter analyze
        working-directory: packages/atomic_flutter
      - run: flutter test
        working-directory: packages/atomic_flutter
  embed-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the embed
        run: bash flutter/scripts/build_embed.sh
      - name: Check the embed size budget
        run: bash flutter/scripts/check_embed_size.sh
