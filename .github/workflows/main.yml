on:
  push:
    branches: [develop]
    tags: ["v*"]
  workflow_dispatch:

# Feature-branch pushes do not trigger CI. Dispatch full validation explicitly
# on a temporary branch containing the exact PR heads to test together.
# A newer push supersedes validation of the previous develop commit. Tags run
# to completion, and per-ref groups isolate manually dispatched PR batches.
concurrency:
  group: main-pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

# Main prefers Mancave (self-hosted) so Dagger cache volumes stay warm.
# Heavy CI runs on GitHub-hosted only when explicitly selected, never as a
# retry after a red test suite.
#
# Flow:
#   1. Pick runner — hosted control job selects the heavy CI runner
#   2. Main (Mancave) XOR Main (GitHub) — one path, not failure-failover
#   3. Main — hosted aggregator for the required status check
#
# Trusted heavy CI defaults to Mancave so its Dagger cache stays warm. The
# selector and result jobs use hosted runners to avoid queueing a few seconds
# of control work behind long Mancave builds. If Mancave is offline, heavy CI
# queues; set CI_RUNNER_OVERRIDE = ["ubuntu-latest"] to explicitly use hosted runners.
# Deployments retain their existing runners.
#
# The old variable name, CI_RUNNER, is set to ["ubuntu-latest"] on purpose.
# Branches cut before #1661 carry a main.yml that runs on every push and reads
# CI_RUNNER, so that setting sends their runs to hosted runners, not Mancave.
#
# SECURITY: pull_request / pull_request_target are forced onto hosted
# runners (never Mancave).

name: "Main pipeline: build, lint, test"

jobs:
  pick:
    name: Pick runner
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      host: ${{ steps.pick.outputs.host }}
    steps:
      - id: pick
        env:
          FORCE_RUNNER: ${{ vars.CI_RUNNER_OVERRIDE }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "pull_request_target" ]; then
            echo "PR event — forcing GitHub-hosted (never run untrusted code on Mancave)"
            echo "host=hosted" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$FORCE_RUNNER" = '["ubuntu-latest"]' ]; then
            echo "CI_RUNNER_OVERRIDE escape hatch — forcing GitHub-hosted"
            echo "host=hosted" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Defaulting heavy CI to Mancave"
          echo "host=mancave" >> "$GITHUB_OUTPUT"

  mancave:
    name: Main (Mancave)
    needs: pick
    if: needs.pick.outputs.host == 'mancave'
    uses: ./.github/workflows/main-ci.yml
    # `packages: write` lets the GITHUB_TOKEN push images to GHCR. An explicit
    # permissions block replaces the defaults, so `contents: read` (checkout)
    # has to come along.
    permissions:
      contents: read
      packages: write
    with:
      runner: ${{ vars.CI_RUNNER_OVERRIDE || '["self-hosted", "Linux", "X64"]' }}
      host-profile: mancave
      e2e-mode: full
    secrets:
      NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}

  # Does this commit still build the closed-source control plane?
  #
  # atomic-saas depends on `../atomic-server/lib` and `../atomic-server/server`
  # by path and used to pin the commit it built against, bumping the pin in a
  # PR of its own after every change here — nineteen times between July and
  # September 2026. Its CI now builds against develop head instead, so a lib
  # rename that nobody carried over would surface there, days later. This job
  # moves that failure to the PR that made it.
  #
  # Paired-PR rule: if atomic-saas has a branch named like this one, that is
  # what gets built (a change that needs both repos lands as two PRs on one
  # branch name); otherwise main. atomic-saas's CI applies the same rule in
  # reverse.
  #
  # Mancave only. The token can read a private repo, and fork PRs never run
  # here; PR events are routed to GitHub-hosted heavy CI by `pick`, which also
  # keeps this job off them. `clean: false` keeps both target/ dirs warm, the same
  # measured reason atomic-saas's own CI gives.
  downstream-saas:
    name: Downstream (atomic-saas builds against this commit)
    needs: pick
    if: >-
      needs.pick.outputs.host == 'mancave' &&
      github.event_name != 'pull_request' &&
      github.event_name != 'pull_request_target'
    runs-on: ${{ fromJSON(vars.CI_RUNNER_OVERRIDE || '["self-hosted", "Linux", "X64"]') }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      # Nothing here runs the dist in a browser; the embed only needs to exist.
      SKIP_WASM_BUILD: "1"
    steps:
      - name: Checkout atomic-server (this commit)
        uses: actions/checkout@v4
        with:
          path: atomic-server
          clean: false

      - name: Pick the atomic-saas branch
        id: saas
        env:
          GH_TOKEN: ${{ secrets.ATOMIC_SAAS_DISPATCH_TOKEN }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::ATOMIC_SAAS_DISPATCH_TOKEN is not set; cannot read ontola/atomic-saas."
            exit 1
          fi
          ref=main
          source="main"
          # Pair only with a namesake that still has an open PR. atomic-saas keeps
          # old claude/project-thread-* branches after their PRs merge, and building
          # one of those fails on its stale Cargo.lock rather than on this commit.
          if [ "$BRANCH" != "develop" ] && gh api "repos/ontola/atomic-saas/branches/$BRANCH" >/dev/null 2>&1; then
            # A failed lookup (e.g. a token without pull-request read access)
            # must not read as "no open PR": that silently builds main, whose
            # lockfile cannot match a branch that adds dependencies. Ask the
            # commit's own PR list first, which a token that can read the
            # branch may also read; only when both lookups fail, pair with the
            # namesake and say so.
            if open=$(gh api "repos/ontola/atomic-saas/pulls?state=open&head=ontola:$BRANCH" -q length 2>"$RUNNER_TEMP/pulls.err") \
              || open=$(gh api "repos/ontola/atomic-saas/commits/$BRANCH/pulls" -q "[.[] | select(.state == \"open\" and .head.ref == \"$BRANCH\")] | length" 2>>"$RUNNER_TEMP/pulls.err"); then
              if [ "${open:-0}" -gt 0 ]; then
                ref="$BRANCH"
                source="paired branch '$BRANCH'"
              else
                source="main (namesake '$BRANCH' has no open PR)"
              fi
            else
              echo "::warning::Could not list atomic-saas PRs for '$BRANCH' ($(head -c 300 "$RUNNER_TEMP/pulls.err")); pairing with the namesake anyway."
              ref="$BRANCH"
              source="paired branch '$BRANCH' (open-PR check failed)"
            fi
          fi
          sha=$(gh api "repos/ontola/atomic-saas/commits/$ref" -q .sha)
          echo "atomic-saas $sha ($source)"
          echo "ref=$sha" >> "$GITHUB_OUTPUT"
          echo "### Downstream: atomic-saas" >> "$GITHUB_STEP_SUMMARY"
          echo "Built \`$sha\` ($source) against this commit." >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout atomic-saas
        uses: actions/checkout@v4
        with:
          repository: ontola/atomic-saas
          ref: ${{ steps.saas.outputs.ref }}
          token: ${{ secrets.ATOMIC_SAAS_DISPATCH_TOKEN }}
          path: atomic-saas
          clean: false
          # Nothing below pushes to atomic-saas, so the PAT has no business
          # staying in atomic-saas/.git/config on the self-hosted runner
          # (where `clean: false` keeps the checkout around between runs).
          persist-credentials: false

      - name: Set up Python for Rust alignment checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify paired Rust toolchains and dependencies
        run: python3 atomic-server/scripts/check-rust-alignment.py --server atomic-server --saas atomic-saas

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
          # Per-runner, not the shared ~/setup-pnpm; see main-ci.yml.
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Both frontends are compile-time embeds in atomic-saas (RustEmbed), so
      # a `cargo check` needs them on disk; contents are irrelevant here.
      - name: Build the data-browser embed
        working-directory: atomic-server/browser
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Build the portal embed
        working-directory: atomic-saas/portal
        run: |
          npm ci
          npm run build

      # Both lockfiles must describe the tested pair; update them in paired PRs.
      - name: cargo check, clippy and test atomic-saas against this commit
        working-directory: atomic-saas
        run: |
          set -euo pipefail
          # Repeated here: the pick step's line falls outside the log tail
          # the API returns once the embed builds have run.
          echo "atomic-saas $(git rev-parse HEAD)"
          cargo check --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
          # The managed node embeds this repo's server crate and is not a
          # default workspace member, so the root build does not touch it.
          # Its own CI runs check, clippy and test; the same here.
          cargo clippy --locked -p atomic-managed-node --all-targets -- -D warnings
          cargo test --locked -p atomic-managed-node
          git diff --exit-code -- Cargo.lock

  # Hosted only when explicitly selected. A PR event would also be hosted if
  # that trigger is ever restored.
  # Deliberately does NOT run when Mancave finished with test failures.
  github:
    name: Main (GitHub)
    needs: pick
    if: needs.pick.outputs.host == 'hosted'
    uses: ./.github/workflows/main-ci.yml
    permissions:
      contents: read
      packages: write
    with:
      runner: '["ubuntu-latest"]'
      host-profile: hosted
      e2e-mode: full
    secrets:
      NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}

  Main:
    name: Main
    needs: [pick, mancave, github, downstream-saas]
    if: always() && needs.pick.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve runner outcome
        run: |
          host="${{ needs.pick.outputs.host }}"
          m="${{ needs.mancave.result }}"
          g="${{ needs.github.result }}"
          d="${{ needs.downstream-saas.result }}"
          echo "host=$host mancave=$m github=$g downstream-saas=$d"
          # The downstream build is skipped on PR events and on hosted runs;
          # when it ran, it has to have passed.
          if [ "$d" = "failure" ] || [ "$d" = "cancelled" ]; then
            echo "atomic-saas no longer builds against this commit — fix it there on a branch with this name, or here."
            exit 1
          fi
          if [ "$host" = "mancave" ] && [ "$m" = "success" ]; then
            exit 0
          fi
          if [ "$host" = "hosted" ] && [ "$g" = "success" ]; then
            exit 0
          fi
          exit 1
