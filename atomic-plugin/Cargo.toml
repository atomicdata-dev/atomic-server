[package]
name = "atomic-plugin"
version = "0.1.1"
edition = "2021"
description = "Helper library for building Atomic Data class extender plugins (server modules on the host ABI) in Wasm"
# Unlike the other `publish = false` members (see ../wasm/Cargo.toml) this one
# is close to publishable. What blocks it is not a path dependency but the WIT
# it generates its bindings from, `../atomic-host/wit`, which lies outside the
# crate: vendor that directory into the crate first.
#
# The name `atomic-plugin` is unclaimed on crates.io. Whoever writes a plugin
# outside this repo needs this crate from a registry, so publishing it is
# probably right eventually — but taking a public crate name is a one-way door,
# and it should be a decision, not a side effect of the first release whose
# workspace happened to include this directory.
#
# To publish: vendor the WIT, drop this line, and bump the version.
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wit-bindgen = { version = "0.48.1", features = ["realloc", "macros"] }
wit-bindgen-rt = "0.44.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4.5", features = ["derive"] }
zip = "0.6"
anyhow = "1.0"
walkdir = "2"

[[bin]]
name = "atomic-plugin"
path = "src/bin.rs"
