packages:
  # all packages in direct subdirs of packages/
  - '*/**'
  # exclude packages that are inside test directories
  - '!create-template/templates/**'
  - '!e2e/template-tests/**'

# Each range below is bounded to the package's current major line
# (>=patched <nextMajor) — an open-ended ">=x" lets pnpm resolve to a much
# newer, unrelated major release wherever nothing else in the graph pins one,
# which is not what a security-patch override should do (caught @babel/core
# jumping 7.29.0 -> 8.0.1, fast-uri 3 -> 4, http-proxy-middleware 3 -> 4, and
# linkify-it 5 -> 6 this way before adding the upper bounds).
overrides:
  tar: '>=7.5.19 <8.0.0'
  axios: '>=1.18.0 <2.0.0'
  brace-expansion@2: '>=2.1.2 <3.0.0'
  brace-expansion@5: '>=5.0.7 <6.0.0'
  # The range-selector overrides above don't reach every dependent (older
  # minimatch@5.x/9.x duplicates still resolved brace-expansion@5.0.6) —
  # force it directly wherever minimatch is the requester, regardless of
  # which minimatch major is asking.
  'minimatch>brace-expansion': '>=5.0.7 <6.0.0'
  fast-uri: '>=3.1.4 <4.0.0'
  find-my-way: '>=9.7.0 <10.0.0'
  form-data: '>=4.0.6 <5.0.0'
  hono: '>=4.12.27 <5.0.0'
  http-proxy-middleware: '>=3.0.7 <4.0.0'
  linkify-it: '>=5.0.2 <6.0.0'
  sharp: '>=0.35.0 <0.36.0'
  svgo: '>=4.0.2 <5.0.0'
  tmp: '>=0.2.6 <0.3.0'
  vite: '>=8.0.16 <9.0.0'
  '@babel/core': '>=7.29.6 <8.0.0'
  body-parser: '>=2.3.0 <3.0.0'
  # Scoped to major-0 requesters only: cookie 1.x is independently required
  # elsewhere (@sveltejs/kit, fastify's light-my-request, @netlify/redirects
  # all declare ^1.x directly) — an unscoped override here would fight that
  # instead of just patching the 0.x line, which is all RUSTSEC/GHSA-2026-*
  # actually needs fixed.
  cookie@0: '>=0.7.0 <1.0.0'
  esbuild: '>=0.28.1 <0.29.0'
  '@hono/node-server': '>=2.0.5 <3.0.0'
  '@opentelemetry/core': '>=2.8.0 <3.0.0'
  markdown-it: '>=14.2.0 <15.0.0'

# React 19 replays memo initializers; warn only when the types object changes.
patchedDependencies:
  '@reactflow/core': patches/@reactflow__core.patch
