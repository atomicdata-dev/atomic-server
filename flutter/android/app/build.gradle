plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader -> localProperties.load(reader) }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode", "1")
def flutterVersionName = localProperties.getProperty("flutter.versionName", "1.0")

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace "com.ontola.atomiccanvas_flutter"
    compileSdk 36
    ndkVersion "27.0.12077973"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "io.ontola.atomic"
        minSdkVersion flutter.minSdkVersion
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // Release builds must never silently use the debug certificate.
            signingConfig signingConfigs.release
        }
    }
}

// Release and profile APKs carry arm64-v8a only. The Flutter plugin resets
// `abiFilters` to arm64 + armeabi-v7a + x86_64 when it is applied, and an
// `ndk { abiFilters }` block here only adds to that list, so third-party
// prebuilt libraries (mobile_scanner's barhopper: 9 MB) stayed in. Excluding
// the other ABIs' libraries from the packaged APK is independent of that.
// Debug keeps every ABI (x86_64 emulators, `flutter run` on any device).
// Other ABIs for a release: `-Patomic.allAbis=true` (see flutter/README.md).
androidComponents {
    onVariants(selector().all()) { variant ->
        if (variant.buildType != "debug" && !project.hasProperty("atomic.allAbis")) {
            variant.packaging.jniLibs.excludes.addAll("**/x86_64/**", "**/armeabi-v7a/**", "**/x86/**")
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source '../..'
}
