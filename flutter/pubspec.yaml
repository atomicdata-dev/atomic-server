name: atomiccanvas_flutter
description: atomic.place

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  atomic_flutter:
    path: ../packages/atomic_flutter
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.5
  rust_lib_atomiccanvas_flutter:
    path: rust_builder
  flutter_rust_bridge: ^2.12.0
  http: ^1.3.0
  ed25519_edwards: ^0.3.1
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.4
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.0
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.10.0
  url_launcher: ^6.3.0
  speech_to_text: ^7.5.0
  flutter_tts: ^4.2.5
  record: ^7.1.2

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    # The embedded renderer, built by scripts/build_embed.sh.
    - assets/embed/
    - assets/embed/assets/
