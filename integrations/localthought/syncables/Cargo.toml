[package]
name = "syncables"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Reads an OpenAPI document to run a mock API server and a client that syncs a local copy of the API's dataset."
authors = ["Michiel de Jong <michiel@unhosted.org>"]
license = "Apache-2.0"
repository = "https://github.com/localthought/syncables-rs"
readme = "README.md"
keywords = ["openapi", "pagination", "sync", "mock-server", "local-first"]
categories = ["web-programming", "api-bindings"]

[dependencies]
async-trait = "0.1"
httpdate = "1"
indexmap = { version = "2", features = ["serde"] }
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
thiserror = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["fs"] }

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full"] }

[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
# The module tree deliberately mirrors the TypeScript original's `src/`
# layout one-to-one, which puts `client/client.rs` inside `client/`.
module_inception = "allow"
# "OpenAPI", "JSONPath" and friends are proper nouns, not code.
doc_markdown = "allow"
# `schema` vs. `scheme` are the spec's own two words, not a typo.
similar_names = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
