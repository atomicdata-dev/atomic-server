[package]
name = "host-abi-module"
version = "0.1.0"
edition = "2021"
description = "Example server module on the Atomic host ABI: hooks on folders"
# Not published, see ../../wasm/Cargo.toml. Built for wasm32-wasip2, not the
# host triple: `cargo build -p host-abi-module --target wasm32-wasip2 --release`.
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.48.1"
serde_json = "1"
