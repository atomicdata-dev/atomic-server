[package]
name = "atomic-loadtest"
version = "0.41.0-beta.8"
edition = "2021"
description = "Load generator for atomic-server: WebSocket connect, commit/fan-out and reconnect-storm scenarios"
license = "MIT"
publish = false

[[bin]]
name = "atomic-loadtest"
path = "src/main.rs"

[dependencies]
atomic_lib = { path = "../../lib", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
rand = "0.8.6"
serde_json = "1"
tokio = { version = "1.52.3", features = ["full"] }
